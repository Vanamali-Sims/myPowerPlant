.flow{fill:none;stroke-linecap:round;stroke-width:5;stroke-dasharray:0 16;animation:dash 1s linear infinite}
.thin{fill:none;stroke-linecap:butt;stroke-width:1.5;stroke-dasharray:4 5;stroke-opacity:.45;animation:dash9 1.8s linear infinite}
.mesh{fill:none;stroke-linecap:butt;stroke-width:1.5;stroke-dasharray:4 5;stroke-opacity:.45;animation:dash9 3s linear infinite}
.rev{animation-direction:reverse}
.track{fill:none;stroke-linecap:round;stroke-width:5;stroke-opacity:.16}

@keyframes dash9{to{stroke-dashoffset:-9}}
.q1{animation:q1 6s ease-in-out infinite}
.q2{animation:q2 6s ease-in-out infinite}
.q3{animation:q3 6s ease-in-out infinite}
.q4{animation:q4 6s ease-in-out infinite}

@keyframes q4{0%,62%{opacity:.15}70%,88%{opacity:1}100%{opacity:.15}}
.panelglow{animation:pg 6s ease-in-out infinite}
@keyframes pg{0%{fill-opacity:.25}10%,88%{fill-opacity:.7}100%{fill-opacity:.25}}
@media (prefers-reduced-motion:reduce){.flow,.thin,.mesh{animation:none;stroke-dasharray:none}.q1,.q2,.q3,.q4,.panelglow{animation:none}}

body{background:#EAE4D8;font-family:'DM Sans',sans-serif;padding:32px;display:flex;flex-direction:column;gap:24px}
.card{background:#133029;border-radius:24px;padding:32px;max-width:900px}
h2{font-size:13px;color:#4A453D;margin:0 0 -14px}
